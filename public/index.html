<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes Stats</title>
<script>
  // Apply a saved theme choice before first paint to avoid a flash. No saved
  // choice → leave data-theme unset so the OS preference (media query) wins.
  try {
    var t = localStorage.getItem('hsd-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  :root {
    color-scheme: light;
    --page:          #f9f9f7;
    --surface-1:     #fcfcfb;
    --text-primary:  #0b0b0b;
    --text-secondary:#52514e;
    --text-muted:    #898781;
    --gridline:      #e1e0d9;
    --baseline:      #c3c2b7;
    --border:        rgba(11,11,11,0.10);
    --good:          #0ca30c;
    --critical:      #d03b3b;
    --series-1:      #2a78d6;  /* input tokens */
    --series-2:      #1baf7a;  /* output tokens */
    --series-3:      #eda100;  /* reasoning tokens */
    --series-4:      #008300;
    --series-5:      #4a3aa7;
  }
  /* Dark palette, shared by the OS-preference media query and the explicit
     data-theme override. The media query yields to an explicit light choice
     (:not([data-theme="light"])); an explicit dark choice wins even on an
     OS-light machine. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:          #0d0d0d;
      --surface-1:     #1a1a19;
      --text-primary:  #ffffff;
      --text-secondary:#c3c2b7;
      --text-muted:    #898781;
      --gridline:      #2c2c2a;
      --baseline:      #383835;
      --border:        rgba(255,255,255,0.10);
      --series-1:      #3987e5;
      --series-2:      #199e70;
      --series-3:      #c98500;
      --series-4:      #008300;
      --series-5:      #9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:          #0d0d0d;
    --surface-1:     #1a1a19;
    --text-primary:  #ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:    #898781;
    --gridline:      #2c2c2a;
    --baseline:      #383835;
    --border:        rgba(255,255,255,0.10);
    --series-1:      #3987e5;
    --series-2:      #199e70;
    --series-3:      #c98500;
    --series-4:      #008300;
    --series-5:      #9085e9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 48px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 20px; font-weight: 650; margin: 0; }
  header .setup-link { margin-left: auto; font-size: 13px; color: var(--text-secondary); }
  .theme-toggle {
    appearance: none; display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0; cursor: pointer;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-1); color: var(--text-secondary);
    align-self: center;
  }
  .theme-toggle:hover { color: var(--text-primary); border-color: var(--baseline); }
  .theme-toggle svg { width: 16px; height: 16px; display: block; }
  .status-line { color: var(--text-secondary); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); flex: none; }
  .status-dot.up { background: var(--good); }
  .status-dot.down { background: var(--critical); }

  .tabs { display: flex; gap: 4px; margin: 16px 0 0; border-bottom: 1px solid var(--gridline); }
  .tab-btn {
    appearance: none; border: none; background: none; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--text-muted);
    padding: 8px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--text-primary); }
  [role="tabpanel"][hidden] { display: none; }

  .filters { display: flex; gap: 8px; align-items: center; margin: 18px 0 16px; }
  .filters .label { color: var(--text-muted); font-size: 13px; margin-right: 4px; }
  .range-btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-secondary); border-radius: 8px; padding: 5px 12px;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .range-btn:hover { color: var(--text-primary); }
  .range-btn[aria-pressed="true"] {
    color: var(--text-primary); font-weight: 600; border-color: var(--baseline);
  }

  .grid { display: grid; gap: 14px; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .cols  { grid-template-columns: 1fr 1fr; margin-top: 14px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; min-width: 0;
  }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 0 0 10px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  .tile .label { font-size: 13px; color: var(--text-secondary); }
  .tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .tile.hero .value { font-size: 48px; line-height: 1.1; }
  .tile .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .tile.hero .tile-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .tile.hero .tile-head .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile.hero .tile-head .seg { flex: none; }
  .tile.hero .tile-head .seg-btn { padding: 3px 8px; font-size: 11px; }
  .tile-split { display: flex; gap: 12px; margin-top: 2px; min-width: 0; }
  .tile-split .split-item { min-width: 0; flex: 1; }
  .tile-split .split-label { font-size: 12px; color: var(--text-muted); }
  .tile.hero .tile-split .value {
    font-size: 22px; line-height: 1.15; margin-top: 0;
    font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
  }
  .tile-split .split-item.input .value { color: var(--series-1); }
  .tile-split .split-item.output .value { color: var(--series-2); }

  .chart-card { margin-top: 14px; }
  .chart-holder { position: relative; }

  /* ── Gateway activity card ── */
  .activity-card { margin-top: 14px; }
  .busy-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
  }
  .busy-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); flex: none; }
  .busy-badge.busy { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
  .busy-badge.busy .dot { background: var(--good); animation: pulse 1.6s ease-in-out infinite; }
  .busy-badge.offline { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 40%, transparent); }
  .busy-badge.offline .dot { background: var(--critical); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .activity-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; }
  .act-item .act-label { font-size: 12px; color: var(--text-muted); }
  .act-item .act-value { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .act-item .act-value.text { font-size: 15px; font-variant-numeric: normal; }
  .act-item .act-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .act-item .act-value.text .mode-word { text-transform: capitalize; }

  .active-block { margin-top: 14px; border-top: 1px solid var(--gridline); padding-top: 12px; }
  .active-block[hidden] { display: none; }
  .active-block .ab-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .active-row {
    display: flex; align-items: center; gap: 10px; padding: 7px 0;
    border-bottom: 1px solid var(--gridline);
  }
  .active-row:last-child { border-bottom: none; }
  .active-row .ar-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
  .active-row .ar-dot.stale { background: var(--text-muted); }
  .active-row .ar-main { min-width: 0; flex: 1; }
  .active-row .ar-title { color: var(--text-primary); overflow-wrap: anywhere; }
  .active-row .ar-meta { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .active-row .ar-age { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  .active-block .ab-note { font-size: 12px; color: var(--text-muted); margin-top: 10px; }

  .profiles-block { margin-top: 14px; border-top: 1px solid var(--gridline); padding-top: 12px; }
  .profiles-block .pb-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .profile-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .profile-chip {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
    font-size: 13px; color: var(--text-secondary);
  }
  .profile-chip .pc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); flex: none; }
  .profile-chip.live { color: var(--text-primary); border-color: var(--baseline); }
  .profile-chip.live .pc-dot { background: var(--good); }
  .profile-chip .pc-tag { font-size: 11px; color: var(--text-muted); }
  .profile-chip.active-default { font-weight: 600; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
  .legend .key { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .legend .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }

  .tooltip {
    position: absolute; pointer-events: none; z-index: 5;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    font-size: 12px; min-width: 150px; display: none;
  }
  .tooltip .tt-title { color: var(--text-muted); margin-bottom: 5px; }
  .tooltip .tt-row { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
  .tooltip .tt-key { width: 10px; height: 0; border-top: 3px solid; border-radius: 2px; flex: none; }
  .tooltip .tt-val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tooltip .tt-name { color: var(--text-secondary); }

  .toggle-btn {
    appearance: none; border: none; background: none; padding: 2px 4px;
    font: inherit; font-size: 12px; color: var(--text-muted); cursor: pointer; text-decoration: underline;
  }
  .toggle-btn:hover { color: var(--text-primary); }

  .head-controls { display: flex; align-items: center; gap: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg-btn {
    appearance: none; border: none; background: var(--surface-1); cursor: pointer;
    font: inherit; font-size: 12px; color: var(--text-muted); padding: 4px 10px;
  }
  .seg-btn + .seg-btn { border-left: 1px solid var(--border); }
  .seg-btn:hover { color: var(--text-primary); }
  .seg-btn[aria-pressed="true"] { background: var(--page); color: var(--text-primary); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 600; color: var(--text-muted); font-size: 12px;
       border-bottom: 1px solid var(--gridline); padding: 4px 8px 6px 0; }
  td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--gridline); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .cell-main { color: var(--text-primary); overflow-wrap: anywhere; }
  .cell-sub { color: var(--text-muted); font-size: 12px; }

  .bar-track { display: flex; align-items: center; gap: 8px; }
  .bar-rail { flex: 1; min-width: 0; }
  .bar-fill { height: 14px; border-radius: 0 4px 4px 0; background: var(--series-1); }
  .bar-label { flex: none; min-width: 44px; font-variant-numeric: tabular-nums; color: var(--text-secondary); font-size: 12px; white-space: nowrap; }

  .empty { color: var(--text-muted); font-size: 13px; padding: 8px 0; }
  .error-card { border-color: var(--critical); }
  .error-card code { background: var(--page); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .loading-dim { opacity: 0.45; transition: opacity 0.15s; }

  svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text-muted); }
  .day-hit { fill: transparent; cursor: default; outline: none; }
  .day-hit:focus-visible { stroke: var(--text-primary); stroke-width: 1; stroke-dasharray: 0; }

  /* ── Engine tab ── */
  .engine-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .engine-identity-card h2 { font-size: 15px; color: var(--text-primary); margin: 0; }
  .engine-strip-canvas { width: 100%; height: 140px; display: block; margin-top: 4px; }
  .tile .val-unit { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-left: 3px; }
  .tile.state-idle .value { color: var(--text-muted); }
  .tile.state-generating .value { color: var(--series-2); }
  .tile.state-prefilling .value { color: var(--series-1); }
  .tile.state-queued .value { color: var(--critical); }

  .slot-tag {
    display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 600;
    background: var(--gridline); color: var(--text-secondary);
  }
  .slot-tag.gen { background: color-mix(in srgb, var(--series-2) 18%, transparent); color: var(--series-2); }
  .slot-tag.pre { background: color-mix(in srgb, var(--series-1) 18%, transparent); color: var(--series-1); }
  .slot-bar-track { display: flex; align-items: center; gap: 6px; min-width: 120px; }
  .slot-bar-rail { flex: 1; height: 6px; border-radius: 3px; background: var(--gridline); overflow: hidden; min-width: 40px; }
  .slot-bar-fill { height: 100%; }
  .slot-bar-label { font-size: 11px; color: var(--text-muted); white-space: nowrap; flex: none; }
  tr.slot-idle td { color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hermes Stats</h1>
    <div class="status-line" id="status-line">
      <span class="status-dot" id="status-dot"></span><span id="status-text">connecting…</span>
    </div>
    <a class="setup-link" href="/setup.html">Setup</a>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme"></button>
  </header>

  <div class="tabs" role="tablist" aria-label="Dashboard sections">
    <button class="tab-btn" id="tab-usage-btn" role="tab" type="button"
      aria-selected="true" aria-controls="tab-usage">Usage</button>
    <button class="tab-btn" id="tab-engine-btn" role="tab" type="button"
      aria-selected="false" aria-controls="tab-engine">Engine</button>
  </div>

  <div id="tab-usage" role="tabpanel" aria-labelledby="tab-usage-btn">
    <div class="filters" role="group" aria-label="Date range">
      <span class="label">Range</span>
      <button class="range-btn" data-days="7"  aria-pressed="false">Last 7 days</button>
      <button class="range-btn" data-days="30" aria-pressed="true">Last 30 days</button>
      <button class="range-btn" data-days="90" aria-pressed="false">Last 90 days</button>
    </div>

    <div id="content">
      <div class="grid tiles" id="tiles"></div>

      <div class="card activity-card" id="activity-card">
        <div class="card-head">
          <h2>Gateway activity</h2>
          <span class="busy-badge" id="busy-badge"></span>
        </div>
        <div class="activity-grid" id="activity-grid"></div>
        <div class="active-block" id="active-block"></div>
        <div class="profiles-block" id="profiles-block"></div>
      </div>

      <div class="card chart-card">
        <div class="card-head">
          <h2 id="chart-title">Token counts over time</h2>
          <div class="head-controls">
            <div class="seg" id="token-view-seg" role="group" aria-label="Token chart breakdown">
              <button class="seg-btn" type="button" data-view="type" aria-pressed="true">By type</button>
              <button class="seg-btn" type="button" data-view="profile" aria-pressed="false">By profile</button>
            </div>
            <button class="toggle-btn" id="chart-toggle" aria-pressed="false">Table view</button>
          </div>
        </div>
        <div class="chart-holder" id="chart-holder">
          <div id="chart"></div>
          <div class="tooltip" id="tooltip"></div>
        </div>
        <div class="legend" id="chart-legend"></div>
        <div id="chart-table" hidden></div>
      </div>

      <div class="card chart-card">
        <div class="card-head">
          <h2>Usage by model</h2>
          <button class="toggle-btn" id="model-toggle" aria-pressed="false">Table view</button>
        </div>
        <div class="chart-holder" id="model-holder">
          <div id="model-chart"></div>
          <div class="tooltip" id="model-tooltip"></div>
        </div>
        <div class="legend" id="model-legend"></div>
        <div id="model-table" hidden></div>
      </div>

      <div class="grid cols">
        <div class="card">
          <h2>Top models</h2>
          <div id="top-models"></div>
        </div>
        <div class="card">
          <h2>Recent sessions</h2>
          <div id="sessions"></div>
        </div>
      </div>
    </div>

    <div class="card error-card" id="error-card" hidden style="margin-top:14px"></div>
  </div>

  <div id="tab-engine" role="tabpanel" aria-labelledby="tab-engine-btn" hidden>
    <div class="filters" role="group" aria-label="Engine picker" id="engine-picker-row" hidden>
      <span class="label">Engine</span>
      <div class="seg" id="engine-picker" role="group" aria-label="Select engine"></div>
    </div>

    <div id="engine-empty" class="card" hidden>
      <div class="empty" id="engine-empty-text"></div>
    </div>

    <div id="engine-content" hidden>
      <div class="card engine-identity-card">
        <h2 id="engine-identity-title">—</h2>
        <div class="engine-sub" id="engine-identity-sub"></div>
      </div>

      <div class="grid tiles" id="engine-tiles" style="margin-top:14px"></div>

      <div class="card chart-card">
        <div class="card-head">
          <h2>Token flow per interval</h2>
          <div class="legend" id="engine-strip-legend"></div>
        </div>
        <canvas id="engine-strip" class="engine-strip-canvas"></canvas>
        <div class="engine-sub" id="engine-strip-note"></div>
      </div>

      <div class="card chart-card">
        <h2>Slots</h2>
        <div id="engine-slots"></div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// ── State ───────────────────────────────────────────────────────────
let days = 30;
let overview = null;

const $ = (id) => document.getElementById(id);

// ── Formatters ──────────────────────────────────────────────────────
const fmtFull = (n) => Number(n || 0).toLocaleString('en-US');
function fmtCompact(n) {
  n = Number(n || 0);
  const one = (v) => v.toFixed(1).replace(/\.0$/, '');
  if (Math.abs(n) >= 1e9) return one(n / 1e9) + 'B';
  if (Math.abs(n) >= 1e6) return one(n / 1e6) + 'M';
  if (Math.abs(n) >= 1e4) return one(n / 1e3) + 'K';
  return fmtFull(n);
}
const fmtUsd = (n) => '$' + Number(n || 0).toFixed(2);
function fmtDay(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function fmtWhen(epoch) {
  if (!epoch) return '—';
  const d = new Date(epoch * 1000);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
    ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
function fmtAge(seconds) {
  if (seconds == null) return '—';
  if (seconds < 60) return `${seconds}s ago`;
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
  return `${Math.floor(seconds / 86400)}d ago`;
}

// DOM helper — data goes in via textContent only (labels are untrusted).
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'text') node.textContent = v;
    else if (k === 'style') node.style.cssText = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c) node.appendChild(c);
  return node;
}
const svgEl = (tag, attrs) => {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  return node;
};

// ── Series definition (fixed slot order — never cycled) ─────────────
const SERIES = [
  { key: 'input_tokens',     name: 'Input',     cssVar: '--series-1' },
  { key: 'output_tokens',    name: 'Output',    cssVar: '--series-2' },
  { key: 'reasoning_tokens', name: 'Reasoning', cssVar: '--series-3' },
];
const seriesColor = (s) =>
  getComputedStyle(document.documentElement).getPropertyValue(s.cssVar).trim();

// ── Data shaping ────────────────────────────────────────────────────
// The usage endpoint only returns rows for days with activity; fill the
// window with zero days so the time axis is honest.
function filledDaily(daily, windowDays) {
  const byDay = new Map((daily || []).map((r) => [r.day, r]));
  const out = [];
  const today = new Date();
  for (let i = windowDays - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    out.push(byDay.get(key) || { day: key });
  }
  return out;
}
function sessionRows(sessions) {
  if (Array.isArray(sessions)) return sessions;
  if (sessions && Array.isArray(sessions.sessions)) return sessions.sessions;
  return [];
}

// ── Stat tiles ──────────────────────────────────────────────────────
let tileTokenView = 'total'; // 'total' | 'split'

function renderTiles(totals) {
  const t = totals || {};
  const totalTokens =
    Number(t.total_input || 0) + Number(t.total_output || 0) +
    Number(t.total_reasoning || 0);
  const cost = Number(t.total_actual_cost || 0) || Number(t.total_estimated_cost || 0);

  const heroSeg = el('div', {
    class: 'seg', id: 'tile-token-seg', role: 'group', 'aria-label': 'Token total view',
  },
    el('button', {
      class: 'seg-btn', type: 'button', 'data-view': 'total',
      'aria-pressed': String(tileTokenView === 'total'), text: 'Total',
    }),
    el('button', {
      class: 'seg-btn', type: 'button', 'data-view': 'split',
      'aria-pressed': String(tileTokenView === 'split'), text: 'In / Out',
    }),
  );
  const heroHead = el('div', { class: 'tile-head' },
    el('div', { class: 'label', text: `Total tokens · last ${days}d` }),
    heroSeg,
  );
  const reasoning = Number(t.total_reasoning || 0);
  let heroBody;
  let heroSubText;
  if (tileTokenView === 'split') {
    heroBody = el('div', { class: 'tile-split' },
      el('div', { class: 'split-item input' },
        el('div', { class: 'split-label', text: 'Input' }),
        el('div', { class: 'value', text: fmtCompact(t.total_input) }),
      ),
      el('div', { class: 'split-item output' },
        el('div', { class: 'split-label', text: 'Output' }),
        el('div', { class: 'value', text: fmtCompact(t.total_output) }),
      ),
    );
    const parts = [];
    if (reasoning) parts.push(`${fmtCompact(reasoning)} reasoning`);
    parts.push(`${fmtCompact(t.total_cache_read)} cache reads`);
    heroSubText = parts.join(' · ');
  } else {
    heroBody = el('div', { class: 'value', text: fmtCompact(totalTokens) });
    heroSubText = `${fmtCompact(t.total_cache_read)} cache reads`;
  }
  const hero = el('div', { class: 'card tile hero' },
    heroHead,
    heroBody,
    el('div', { class: 'sub', text: heroSubText }),
  );

  const tiles = [
    { label: 'Sessions', value: fmtCompact(t.total_sessions), sub: '' },
    { label: 'API calls', value: fmtCompact(t.total_api_calls), sub: '' },
    { label: 'Cost', value: fmtUsd(cost),
      sub: Number(t.total_actual_cost || 0) ? 'actual' : 'estimated' },
  ];
  const holder = $('tiles');
  holder.replaceChildren(
    hero,
    ...tiles.map((tile) =>
      el('div', { class: 'card tile' },
        el('div', { class: 'label', text: tile.label }),
        el('div', { class: 'value', text: tile.value }),
        tile.sub ? el('div', { class: 'sub', text: tile.sub }) : null,
      )),
  );
}

// ── Token chart (stacked columns; view = by token type or by profile) ─
let tokenView = 'type'; // 'type' | 'profile'

const PROFILE_SLOT_VARS = ['--series-1', '--series-2', '--series-3', '--series-4', '--series-5'];
const PROFILE_CAP = 5;
const PROFILE_OTHER_KEY = '␀other';

// Build per-profile stacked series from overview.usage_by_profile. Top N
// profiles by total get fixed color slots (assigned by profile identity so
// the color is stable across date ranges); the rest fold into "Other".
function buildProfileStacks() {
  const list = (overview && Array.isArray(overview.usage_by_profile)) ? overview.usage_by_profile : [];
  const ranked = list.filter((p) => Number(p.total) > 0).sort((a, b) => b.total - a.total);
  const named = ranked.slice(0, PROFILE_CAP);
  const rest = ranked.slice(PROFILE_CAP);
  const slotOrder = named.map((p) => p.profile).sort();
  const series = named.map((p) => ({
    key: p.profile, name: p.profile,
    color: `var(${PROFILE_SLOT_VARS[slotOrder.indexOf(p.profile)] || '--series-5'})`,
  }));
  if (rest.length) series.push({ key: PROFILE_OTHER_KEY, name: 'Other', color: 'var(--text-muted)' });
  const byDay = new Map();
  const add = (day, key, tok) => { const m = byDay.get(day) || {}; m[key] = (m[key] || 0) + tok; byDay.set(day, m); };
  for (const p of named) for (const r of (p.daily || [])) add(r.day, p.profile, Number(r.tokens || 0));
  for (const p of rest) for (const r of (p.daily || [])) add(r.day, PROFILE_OTHER_KEY, Number(r.tokens || 0));
  return { series, byDay };
}

// Unified model for the stacked-column chart in either view. Each row is
// { day, values: {seriesKey: number}, ...extraFields }; `extras` are extra
// tooltip/table lines pulled from row-level fields (type view only).
function tokenModel() {
  const usage = (overview && overview.usage) || {};
  if (tokenView === 'profile') {
    const { series, byDay } = buildProfileStacks();
    const rows = filledDaily([], days).map((r) => ({ day: r.day, values: byDay.get(r.day) || {} }));
    return { series, rows, extras: [], showTotal: true,
      aria: `Daily token counts by profile, last ${days} days`, unitLabel: 'tokens' };
  }
  const series = SERIES.map((s) => ({ key: s.key, name: s.name, color: `var(${s.cssVar})` }));
  const rows = filledDaily(usage.daily, days).map((r) => ({
    day: r.day,
    values: {
      input_tokens: Number(r.input_tokens || 0),
      output_tokens: Number(r.output_tokens || 0),
      reasoning_tokens: Number(r.reasoning_tokens || 0),
    },
    cache_read_tokens: Number(r.cache_read_tokens || 0),
    sessions: Number(r.sessions || 0),
  }));
  return { series, rows, showTotal: false,
    extras: [
      { key: 'cache_read_tokens', name: 'Cache read', color: 'var(--text-muted)' },
      { key: 'sessions', name: 'Sessions', color: 'transparent', integer: true },
    ],
    aria: `Stacked daily token counts, last ${days} days`, unitLabel: 'tokens' };
}

function renderChart() {
  const holder = $('chart');
  hideTooltip();
  const model = tokenModel();
  const { series, rows } = model;
  const stackTotal = (row) => series.reduce((a, s) => a + Number(row.values[s.key] || 0), 0);

  if (!series.length || !rows.some((r) => stackTotal(r) > 0)) {
    holder.replaceChildren(el('div', { class: 'empty',
      text: tokenView === 'profile'
        ? 'No per-profile token data in this window.'
        : 'No token activity in this window.' }));
    $('chart-legend').replaceChildren();
    renderChartTable(model);
    return;
  }
  const W = 1000, H = 260, padL = 46, padR = 8, padT = 10, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const maxV = Math.max(1, ...rows.map(stackTotal));
  // Clean tick ceiling: 1/2/5 × 10^k just above the max.
  const pow = Math.pow(10, Math.floor(Math.log10(maxV)));
  const yMax = [1, 2, 5, 10].map((m) => m * pow).find((v) => v >= maxV);

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img',
    'aria-label': model.aria });

  // Gridlines + y ticks (hairline, solid, recessive)
  for (let i = 0; i <= 4; i++) {
    const v = (yMax / 4) * i;
    const y = padT + plotH - (v / yMax) * plotH;
    svg.appendChild(svgEl('line', { x1: padL, x2: W - padR, y1: y, y2: y,
      stroke: i === 0 ? 'var(--baseline)' : 'var(--gridline)', 'stroke-width': 1 }));
    if (i > 0) {
      const t = svgEl('text', { x: padL - 6, y: y + 3.5, 'text-anchor': 'end' });
      t.textContent = fmtCompact(v);
      svg.appendChild(t);
    }
  }

  const band = plotW / rows.length;
  const barW = Math.min(24, Math.max(2, band - 2)); // ≤24px, 2px surface gap between bars
  const segGap = 2;
  const r = 4;

  rows.forEach((row, i) => {
    const x = padL + i * band + (band - barW) / 2;
    let yCursor = padT + plotH;
    const segs = series
      .map((s) => ({ s, v: Number(row.values[s.key] || 0) }))
      .filter((d) => d.v > 0);
    segs.forEach((d, idx) => {
      const hRaw = (d.v / yMax) * plotH;
      const isTop = idx === segs.length - 1;
      const gap = idx > 0 ? segGap : 0;
      const h = Math.max(1, hRaw - gap);
      const y = yCursor - gap - h;
      if (isTop && h >= r) {
        // 4px rounded data-end, square at the baseline side
        svg.appendChild(svgEl('path', {
          d: `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + barW - r},${y} Q${x + barW},${y} ${x + barW},${y + r} L${x + barW},${y + h} Z`,
          fill: d.s.color,
        }));
      } else {
        svg.appendChild(svgEl('rect', { x, y, width: barW, height: h, fill: d.s.color }));
      }
      yCursor = y;
    });

    // X labels — roughly 6 across the window
    if (i % Math.ceil(rows.length / 6) === 0) {
      const t = svgEl('text', { x: x + barW / 2, y: H - 8, 'text-anchor': 'middle' });
      t.textContent = fmtDay(row.day);
      svg.appendChild(t);
    }

    // Hit target: the full day band, keyboard-focusable
    const hit = svgEl('rect', { x: padL + i * band, y: padT, width: band,
      height: plotH, class: 'day-hit', tabindex: '0',
      'aria-label': `${fmtDay(row.day)}: ${fmtFull(stackTotal(row))} tokens` });
    const show = () => showDayTooltip(model, row, padL + i * band + band / 2, W);
    hit.addEventListener('pointerenter', show);
    hit.addEventListener('focus', show);
    hit.addEventListener('pointerleave', hideTooltip);
    hit.addEventListener('blur', hideTooltip);
    svg.appendChild(hit);
  });

  holder.replaceChildren(svg);

  $('chart-legend').replaceChildren(...series.map((s) =>
    el('span', { class: 'key' },
      el('span', { class: 'swatch', style: `background:${s.color}` }),
      el('span', { text: tokenView === 'profile' ? s.name : s.name + ' tokens' }))));

  renderChartTable(model);
}

function showDayTooltip(model, row, cx, viewW) {
  const tooltip = $('tooltip');
  const { series, extras } = model;
  const rowsEls = [el('div', { class: 'tt-title', text: fmtDay(row.day) })];
  for (const s of series) {
    rowsEls.push(el('div', { class: 'tt-row' },
      el('span', { class: 'tt-key', style: `border-color:${s.color}` }),
      el('span', { class: 'tt-val', text: fmtFull(row.values[s.key] || 0) }),
      el('span', { class: 'tt-name', text: s.name })));
  }
  if (model.showTotal) {
    const total = series.reduce((a, s) => a + Number(row.values[s.key] || 0), 0);
    rowsEls.push(el('div', { class: 'tt-row' },
      el('span', { class: 'tt-key', style: 'border-color:transparent' }),
      el('span', { class: 'tt-val', text: fmtFull(total) }),
      el('span', { class: 'tt-name', text: 'Total' })));
  }
  for (const ex of extras || []) {
    if (ex.integer && !row[ex.key]) continue;
    rowsEls.push(el('div', { class: 'tt-row' },
      el('span', { class: 'tt-key', style: `border-color:${ex.color}` }),
      el('span', { class: 'tt-val', text: fmtFull(row[ex.key] || 0) }),
      el('span', { class: 'tt-name', text: ex.name })));
  }
  tooltip.replaceChildren(...rowsEls);
  tooltip.style.display = 'block';
  const holder = $('chart-holder');
  const frac = cx / viewW;
  const px = frac * holder.clientWidth;
  const ttW = tooltip.offsetWidth;
  tooltip.style.left = Math.max(0, Math.min(holder.clientWidth - ttW, px - ttW / 2)) + 'px';
  tooltip.style.top = '6px';
}
function hideTooltip() { $('tooltip').style.display = 'none'; }

// Table-view twin of the chart (WCAG-clean equivalent)
function renderChartTable(model) {
  const { series, rows, extras } = model;
  const stackTotal = (row) => series.reduce((a, s) => a + Number(row.values[s.key] || 0), 0);
  const active = rows.filter((r) => stackTotal(r) > 0 || (extras || []).some((e) => Number(r[e.key] || 0) > 0));
  const holder = $('chart-table');
  if (!active.length) { holder.replaceChildren(el('div', { class: 'empty', text: 'No activity in this window.' })); return; }
  const head = el('tr', {},
    el('th', { text: 'Day' }),
    ...series.map((s) => el('th', { class: 'num', text: s.name })),
    ...(model.showTotal ? [el('th', { class: 'num', text: 'Total' })] : []),
    ...(extras || []).map((e) => el('th', { class: 'num', text: e.name })));
  const body = active.map((r) => el('tr', {},
    el('td', { text: fmtDay(r.day) }),
    ...series.map((s) => el('td', { class: 'num', text: fmtFull(r.values[s.key] || 0) })),
    ...(model.showTotal ? [el('td', { class: 'num', text: fmtFull(stackTotal(r)) })] : []),
    ...(extras || []).map((e) => el('td', { class: 'num', text: fmtFull(r[e.key] || 0) }))));
  holder.replaceChildren(el('table', {}, el('thead', {}, head), el('tbody', {}, ...body)));
}

// ── Usage by model (smooth curves, one line per model) ─────────────

// Fixed categorical slots for named models; "Other" wears muted gray so it
// never competes with a real series for identity.
const MODEL_SLOT_VARS = ['--series-1', '--series-2', '--series-3', '--series-4', '--series-5'];
const OTHER_COLOR = 'var(--text-muted)';
const MODEL_SERIES_CAP = 4;

// Monotone cubic (Fritsch–Carlson) — smooth curves that never overshoot
// the data, so a spiky token series can't dip below the baseline.
function smoothPath(pts) {
  if (pts.length < 3) return pts.map((p, i) => `${i ? 'L' : 'M'}${p.x},${p.y}`).join(' ');
  const n = pts.length, dx = [], m = [];
  for (let i = 0; i < n - 1; i++) {
    dx.push(pts[i + 1].x - pts[i].x);
    m.push((pts[i + 1].y - pts[i].y) / dx[i]);
  }
  const t = [m[0]];
  for (let i = 1; i < n - 1; i++) {
    if (m[i - 1] * m[i] <= 0) t.push(0);
    else {
      const w1 = 2 * dx[i] + dx[i - 1], w2 = dx[i] + 2 * dx[i - 1];
      t.push((w1 + w2) / (w1 / m[i - 1] + w2 / m[i]));
    }
  }
  t.push(m[n - 2]);
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 0; i < n - 1; i++) {
    d += `C${(pts[i].x + dx[i] / 3).toFixed(1)},${(pts[i].y + t[i] * dx[i] / 3).toFixed(1)} ` +
      `${(pts[i + 1].x - dx[i] / 3).toFixed(1)},${(pts[i + 1].y - t[i + 1] * dx[i] / 3).toFixed(1)} ` +
      `${pts[i + 1].x},${pts[i + 1].y}`;
  }
  return d;
}

// Pivot [{day, model, tokens}] into window-aligned series. Membership: top
// N models by volume; the tail folds into "Other". Slots are assigned
// alphabetically among the chosen models so color follows the model, not
// its rank — switching the date range doesn't repaint survivors.
function buildModelSeries(modelDaily) {
  const windowDays = filledDaily([], days).map((r) => r.day);
  const dayIndex = new Map(windowDays.map((d, i) => [d, i]));
  const totals = new Map();
  for (const r of modelDaily) {
    if (!dayIndex.has(r.day)) continue;
    totals.set(r.model, (totals.get(r.model) || 0) + Number(r.tokens || 0));
  }
  const ranked = [...totals.entries()].sort((a, b) => b[1] - a[1]);
  const named = ranked.slice(0, MODEL_SERIES_CAP).map(([m]) => m);
  const hasOther = ranked.length > named.length;
  const slotOrder = [...named].sort();
  const series = new Map(named.map((m) => [m, {
    name: m,
    color: `var(${MODEL_SLOT_VARS[slotOrder.indexOf(m)]})`,
    total: totals.get(m),
    values: windowDays.map(() => 0),
  }]));
  if (hasOther) {
    series.set('␀other', {
      name: 'Other',
      color: OTHER_COLOR,
      total: ranked.slice(MODEL_SERIES_CAP).reduce((a, [, v]) => a + v, 0),
      values: windowDays.map(() => 0),
    });
  }
  for (const r of modelDaily) {
    const i = dayIndex.get(r.day);
    if (i === undefined) continue;
    const s = series.get(r.model) || series.get('␀other');
    if (s) s.values[i] += Number(r.tokens || 0);
  }
  return {
    days: windowDays,
    series: [...series.values()].sort((a, b) => b.total - a.total),
  };
}

let modelCrosshairCleanup = null;

function renderModelChart(modelDaily) {
  const holder = $('model-chart');
  const tooltip = $('model-tooltip');
  tooltip.style.display = 'none';
  if (modelCrosshairCleanup) { modelCrosshairCleanup(); modelCrosshairCleanup = null; }

  const data = buildModelSeries(modelDaily || []);
  renderModelTable(data);
  if (!data.series.length) {
    holder.replaceChildren(el('div', { class: 'empty', text: 'No per-model usage in this window (session rows may not include token counts).' }));
    $('model-legend').replaceChildren();
    return;
  }

  const W = 1000, H = 260, padL = 46, padR = 8, padT = 10, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxV = Math.max(1, ...data.series.flatMap((s) => s.values));
  const pow = Math.pow(10, Math.floor(Math.log10(maxV)));
  const yMax = [1, 2, 5, 10].map((m) => m * pow).find((v) => v >= maxV);
  const xAt = (i) => padL + (data.days.length === 1 ? plotW / 2 : (i / (data.days.length - 1)) * plotW);
  const yAt = (v) => padT + plotH - (v / yMax) * plotH;

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img',
    'aria-label': `Daily token usage by model, last ${days} days` });

  for (let i = 0; i <= 4; i++) {
    const v = (yMax / 4) * i;
    const y = yAt(v);
    svg.appendChild(svgEl('line', { x1: padL, x2: W - padR, y1: y, y2: y,
      stroke: i === 0 ? 'var(--baseline)' : 'var(--gridline)', 'stroke-width': 1 }));
    if (i > 0) {
      const t = svgEl('text', { x: padL - 6, y: y + 3.5, 'text-anchor': 'end' });
      t.textContent = fmtCompact(v);
      svg.appendChild(t);
    }
  }
  const step = Math.ceil(data.days.length / 6);
  data.days.forEach((day, i) => {
    if (i % step !== 0) return;
    const t = svgEl('text', { x: xAt(i), y: H - 8, 'text-anchor': 'middle' });
    t.textContent = fmtDay(day);
    svg.appendChild(t);
  });

  // Areas under lines first, then lines on top (paint order keeps every
  // stroke visible where washes overlap).
  const baseline = yAt(0);
  for (const s of [...data.series].reverse()) {
    const pts = s.values.map((v, i) => ({ x: +xAt(i).toFixed(1), y: +yAt(v).toFixed(1) }));
    const line = smoothPath(pts);
    svg.appendChild(svgEl('path', {
      d: `${line} L${pts[pts.length - 1].x},${baseline} L${pts[0].x},${baseline} Z`,
      fill: s.color, opacity: '0.1', stroke: 'none',
    }));
    svg.appendChild(svgEl('path', {
      d: line, fill: 'none', stroke: s.color,
      'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
    }));
  }

  // Crosshair layer: a hairline that snaps to the nearest day, plus one
  // tooltip listing every series at that X.
  const crosshair = svgEl('line', { y1: padT, y2: padT + plotH,
    stroke: 'var(--baseline)', 'stroke-width': 1, visibility: 'hidden' });
  svg.appendChild(crosshair);
  const overlay = svgEl('rect', { x: padL, y: padT, width: plotW, height: plotH,
    class: 'day-hit', tabindex: '0',
    'aria-label': 'Usage by model — hover or use arrow keys to read daily values' });
  svg.appendChild(overlay);

  let focusIdx = data.days.length - 1;
  const showAt = (i) => {
    focusIdx = Math.max(0, Math.min(data.days.length - 1, i));
    const cx = xAt(focusIdx);
    crosshair.setAttribute('x1', cx);
    crosshair.setAttribute('x2', cx);
    crosshair.setAttribute('visibility', 'visible');
    const rows = [el('div', { class: 'tt-title', text: fmtDay(data.days[focusIdx]) })];
    for (const s of [...data.series].sort((a, b) => b.values[focusIdx] - a.values[focusIdx])) {
      rows.push(el('div', { class: 'tt-row' },
        el('span', { class: 'tt-key', style: `border-color:${s.color}` }),
        el('span', { class: 'tt-val', text: fmtFull(s.values[focusIdx]) }),
        el('span', { class: 'tt-name', text: s.name })));
    }
    tooltip.replaceChildren(...rows);
    tooltip.style.display = 'block';
    const hostW = $('model-holder').clientWidth;
    const px = (cx / W) * hostW;
    const ttW = tooltip.offsetWidth;
    tooltip.style.left = Math.max(0, Math.min(hostW - ttW, px - ttW / 2)) + 'px';
    tooltip.style.top = '6px';
  };
  const hide = () => {
    crosshair.setAttribute('visibility', 'hidden');
    tooltip.style.display = 'none';
  };
  const onMove = (ev) => {
    const rect = overlay.getBoundingClientRect();
    const frac = (ev.clientX - rect.left) / rect.width;
    showAt(Math.round(frac * (data.days.length - 1)));
  };
  const onKey = (ev) => {
    if (ev.key === 'ArrowLeft') { showAt(focusIdx - 1); ev.preventDefault(); }
    else if (ev.key === 'ArrowRight') { showAt(focusIdx + 1); ev.preventDefault(); }
    else if (ev.key === 'Escape') hide();
  };
  overlay.addEventListener('pointermove', onMove);
  overlay.addEventListener('pointerleave', hide);
  overlay.addEventListener('focus', () => showAt(focusIdx));
  overlay.addEventListener('blur', hide);
  overlay.addEventListener('keydown', onKey);
  modelCrosshairCleanup = hide;

  holder.replaceChildren(svg);

  $('model-legend').replaceChildren(...data.series.map((s) =>
    el('span', { class: 'key' },
      el('span', { class: 'swatch', style: `background:${s.color};height:3px;border-radius:2px` }),
      el('span', { text: s.name }))));
}

function renderModelTable(data) {
  const holder = $('model-table');
  const activeIdx = data.days
    .map((_, i) => i)
    .filter((i) => data.series.some((s) => s.values[i] > 0));
  if (!data.series.length || !activeIdx.length) {

  holder.replaceChildren(el('table', {}, el('thead', {}, head), el('tbody', {}, ...body)));
}

// What each gateway_mode value means, per hermes /api/status topology.
const GATEWAY_MODE_INFO = {
  multiplex: 'One gateway serving several profiles',
  single:    'One gateway, one profile',
  multiple:  'Independent gateway per profile',
  none:      'No gateway process running',
  unknown:   'Topology unavailable',

function actItem(label, value, opts = {}) {
  return el('div', { class: 'act-item' },
    el('div', { class: 'act-label', text: label }),

// A session is "fresh" (a green dot) if it reported activity recently; an
// is_active row that's been idle for a while is shown but de-emphasized.
const ACTIVE_FRESH_SECONDS = 300;

function renderActivity(status, cron, activity) {
  const card = $('activity-card');
  if (!status) { card.style.display = 'none'; return; }
  card.style.display = '';

  const running = status.gateway_running !== false;
  const agents = Number(status.active_agents || 0);
  const active = activity && Array.isArray(activity.sessions) ? activity : { total: 0, sessions: [], by_profile: {} };
  const activeCount = Number(active.total || 0);
  // "Busy" = a main turn is generating; "Active" = live sessions exist even
  // if no turn is mid-flight (e.g. sub-agents working — see the note below).
  const state = !running ? 'offline' : agents > 0 ? 'busy' : activeCount > 0 ? 'active' : 'idle';

  const badge = $('busy-badge');
  const badgeClass = { offline: 'offline', busy: 'busy', active: 'busy', idle: '' }[state];
  const badgeText = { offline: 'Gateway offline', busy: 'Busy', active: 'Active', idle: 'Idle' }[state];
  badge.className = 'busy-badge' + (badgeClass ? ' ' + badgeClass : '');
  badge.replaceChildren(el('span', { class: 'dot' }), el('span', { text: badgeText }));

  // Stat grid
  const mode = String(status.gateway_mode || 'unknown');
  const modeInfo = GATEWAY_MODE_INFO[mode] || GATEWAY_MODE_INFO.unknown;
  const activeProfiles = Object.keys(active.by_profile || {});
  const items = [
    actItem('Active sessions', fmtFull(activeCount), {
      sub: activeProfiles.length ? activeProfiles.join(', ') : 'across all profiles',
    }),
    actItem('In-flight turns', fmtFull(agents), {
      sub: 'main turns · excludes sub-agents',
      title: 'hermes counts in-flight main gateway turns, cron jobs, and API runs here. delegate_task sub-agents are not reported by the API.',
    }),
  ];
  if (cron) {
    items.push(actItem('Cron jobs', fmtFull(cron.total), {
      sub: [cron.running ? `${cron.running} running` : null,
            cron.paused ? `${cron.paused} paused` : null]
        .filter(Boolean).join(' · ') || 'none active',
    }));
  }
  items.push(actItem('Gateway mode', null, {
    text: true, title: modeInfo, sub: modeInfo,
    node: el('span', { class: 'mode-word', text: mode }),
  }));
  $('activity-grid').replaceChildren(...items);

  // Active sessions list (cross-profile, from /api/profiles/sessions is_active).
  const ab = $('active-block');
  if (activeCount > 0) {
    ab.hidden = false;
    const rows = active.sessions.map((s) => {
      const stale = s.age_seconds != null && s.age_seconds > ACTIVE_FRESH_SECONDS;
      const meta = [s.profile, s.model, s.message_count ? `${fmtFull(s.message_count)} msgs` : null,
                    s.source].filter(Boolean).join(' · ');
      return el('div', { class: 'active-row' },
        el('span', { class: 'ar-dot' + (stale ? ' stale' : '') }),
        el('div', { class: 'ar-main' },
          el('div', { class: 'ar-title', text: String(s.title).slice(0, 80) }),
          el('div', { class: 'ar-meta', text: meta })),
        el('span', { class: 'ar-age', text: fmtAge(s.age_seconds) }));
    });
    ab.replaceChildren(
      el('div', { class: 'ab-label', text: `Active sessions — live across all profiles` }),
      ...rows,
      el('div', { class: 'ab-note',
        text: 'Note: hermes does not expose individual sub-agents (delegate_task) over its API — they run inside the parent session and are not separately counted.' }));
  } else {
    ab.hidden = true;
    ab.replaceChildren();
  }

  // Profiles — chips. Prefer live-gateway detail (loopback binds); behind the
  // auth gate that's withheld, so mark profiles that have an active session
  // instead (from the cross-profile session scan).
  const block = $('profiles-block');
  const names = Array.isArray(status.profiles) ? status.profiles : [];
  const gateways = Array.isArray(status.gateways) ? status.gateways : [];
  const liveByName = new Map();
  for (const g of gateways) {
    const served = Array.isArray(g.served_profiles) && g.served_profiles.length
      ? g.served_profiles : [g.profile];
    for (const p of served) liveByName.set(String(p), g);
  }
  const gatewaysKnown = gateways.length > 0;
  const activeSet = new Set(activeProfiles);

  if (!names.length) { block.style.display = 'none'; return; }
  block.style.display = '';
  const label = gatewaysKnown
    ? `Profiles — ${liveByName.size} with a live gateway`
    : activeSet.size
      ? `Profiles — ${names.length} configured, ${activeSet.size} with an active session`
      : `Profiles — ${names.length} configured (live gateway detail hidden behind the auth gate)`;
  const chips = names.map((name) => {
    const gw = liveByName.get(name);
    const hasSession = activeSet.has(name);
    const live = !!gw || hasSession;
    const ports = gw && gw.ports ? Object.values(gw.ports).filter(Boolean) : [];
    const title = gw && ports.length ? `ports: ${ports.join(', ')}`
      : hasSession ? 'active session running' : (gw ? 'live gateway' : 'no live gateway');
    return el('div', {
      class: 'profile-chip' + (live ? ' live' : ''),
      title,
    },
      el('span', { class: 'pc-dot' }),
      el('span', { text: name }),
      hasSession ? el('span', { class: 'pc-tag', text: 'active' })
        : gw ? el('span', { class: 'pc-tag', text: 'live' }) : null);
  });
  block.replaceChildren(
    el('div', { class: 'pb-label', text: label }),
    el('div', { class: 'profile-chips' }, ...chips));
}

function renderStatus(status, model, meta) {
  const dot = $('status-dot'), text = $('status-text');
  if (!status && !model) {
    dot.className = 'status-dot down';
    text.textContent = `no hermes dashboard at ${meta?.dashboard_url || ''}`;
    return;
  }
  dot.className = 'status-dot up';
  const bits = [];
  const m = model || {};
  if (m.model || m.current_model) bits.push(m.provider ? `${m.provider} / ${m.model || m.current_model}` : (m.model || m.current_model));
  const platforms = status?.gateway_platforms || status?.platforms;
  const platformCount = Array.isArray(platforms) ? platforms.length
    : (platforms && typeof platforms === 'object') ? Object.keys(platforms).length : 0;
  if (platformCount) bits.push(`${platformCount} platform${platformCount > 1 ? 's' : ''}`);
  if (meta?.aggregated_across_profiles) {
    bits.push(`stats across ${meta.profiles_with_data}/${meta.profiles_total} profiles`);
  }
  if (meta?.auth_mode && meta.auth_mode !== 'none') bits.push(`auth: ${meta.auth_mode}`);
  text.textContent = bits.join(' · ') || 'connected';
}

async function refresh() {
  $('content').classList.add('loading-dim'); // hold previous render, no skeleton
  try {
    const res = await fetch(`/api/overview?days=${days}`);
    overview = await res.json();
    const usage = overview.usage;
    const reachable = usage || overview.status || overview.model || overview.sessions;
    $('error-card').hidden = !!reachable;
    if (!reachable) {
      const card = $('error-card');
      card.replaceChildren(
        el('h2', { text: 'Cannot reach the hermes dashboard service' }),
        el('div', { class: 'empty' },
          el('span', { text: `Nothing answered at ${overview.meta?.dashboard_url}. Start hermes ("hermes dashboard", or the gateway with the dashboard enabled), or open ` }),
          el('a', { href: '/setup.html', text: 'Setup' }),
          el('span', { text: ' to point this app at a remote dashboard and configure auth (v0.17+ dashboards behind the auth gate need a bearer token or session cookie).' })));
    }
    renderStatus(overview.status, overview.model, overview.meta);
    renderActivity(overview.status, overview.cron, overview.active);
    renderTiles(usage?.totals);
    renderChart();
    renderModelChart(overview.model_daily || []);
    renderTopModels(usage?.by_model);
    renderSessions(overview.sessions);
  } catch (err) {
    $('status-dot').className = 'status-dot down';
    $('status-text').textContent = 'stats server unreachable';
  } finally {
    $('content').classList.remove('loading-dim');
  }
}

// ── Engine tab ──────────────────────────────────────────────────────
let engineList = [];
let currentEngineId = null;
let enginePollTimer = null;
const ENGINE_POLL_MS = 4000;
const ENGINE_MAXCOLS = 160;

// Per-engine running series, rebuilt from scratch on engine switch or a
// detected server restart (counters going backwards) — none of it is
// comparable across either boundary.
let engineSamples = [];      // [{t, m}] raw metric snapshots, m may be null
let engineDeltas = [];       // [{t, dt, preTok, preSec, genTok, genSec, decodes, livePre, liveGen}]
let engineSlotPrev = {};     // slot id -> {task, decoded, processed}
let engineTaskPrompt = {};   // task id -> {cache, total}
let engineTaskOrder = [];
let engineReqCount = 0;
let engineHasPromptFields = false;

function resetEngineSeries() {
  engineSamples = []; engineDeltas = []; engineSlotPrev = {};
  engineTaskPrompt = {}; engineTaskOrder = []; engineReqCount = 0;
}

function fmtNum(n, dp) {
  if (n === null || n === undefined || !Number.isFinite(n)) return '—';
  dp = dp === undefined ? 1 : dp;
  return n.toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
}
function firstNum(list) {
  for (const v of list) if (typeof v === 'number' && Number.isFinite(v)) return v;
  return 0;
}
function valueWithUnit(numText, unit) {
  return el('span', {}, document.createTextNode(numText), unit ? el('span', { class: 'val-unit', text: unit }) : null);
}
function tileEl(label, valueNode, sub, extraClass) {
  return el('div', { class: 'card tile' + (extraClass ? ' ' + extraClass : '') },
    el('div', { class: 'label', text: label }),
    el('div', { class: 'value' }, valueNode),
    sub ? el('div', { class: 'sub', text: sub }) : null);
}

// Mirrors the standalone telemetry page's slot-progress reader: first
// sighting of a slot only baselines it (a request already mid-flight would
// otherwise dump its whole history into one interval); after that, a
// changed task id means the slot's own counters restarted at zero, so the
// current value *is* the delta rather than a difference.
function readSlots(slots, dt) {
  const live = { gen: 0, pre: 0, generating: 0, prefilling: 0, idle: 0 };
  if (!Array.isArray(slots)) return null;
  const next = {};
  for (const s of slots) {
    const id = String(s.id);
    const task = s.id_task === undefined ? -1 : s.id_task;
    const nt = s.next_token || {};
    const dec = firstNum([nt.n_decoded, s.n_decoded]);
    const proc = firstNum([s.n_prompt_tokens_processed, s.prompt_n]);
    const cache = firstNum([s.n_prompt_tokens_cache, s.cache_n]);
    const total = firstNum([s.n_prompt_tokens, s.prompt_tokens]);
    const p = engineSlotPrev[id];
    const sameTask = p && p.task === task;
    const dDec = !p ? 0 : (sameTask ? Math.max(0, dec - p.decoded) : dec);
    const dProc = !p ? 0 : (sameTask ? Math.max(0, proc - p.processed) : proc);
    if (s.is_processing) {
      live.gen += dDec; live.pre += dProc;
      if (dec > 0) live.generating++; else live.prefilling++;
    } else {
      live.idle++;
    }
    if (task !== -1 && total > 0) {
      if (!engineTaskPrompt[task]) engineTaskOrder.push(task);
      engineTaskPrompt[task] = { cache, total };
    }
    if (task !== -1 && (!p || p.task !== task) && s.is_processing) engineReqCount++;
    next[id] = { task, decoded: dec, processed: proc };
  }
  engineSlotPrev = next;
  while (engineTaskOrder.length > 300) delete engineTaskPrompt[engineTaskOrder.shift()];
  live.genRate = dt > 0 ? live.gen / dt : 0;
  live.preRate = engineHasPromptFields ? (dt > 0 ? live.pre / dt : 0) : null;
  return live;
}

function engineCacheReuse() {
  let c = 0, t = 0;
  for (const k in engineTaskPrompt) { c += engineTaskPrompt[k].cache; t += engineTaskPrompt[k].total; }
  return t > 0 ? { pct: 100 * c / t, cached: c, total: t } : null;
}

function computeLiveRates() {
  const w = engineDeltas.slice(-3);
  let lp = 0, np = 0, lg = 0, ng = 0;
  for (const d of w) {
    if (d.livePre !== null && d.livePre !== undefined) { lp += d.livePre; np++; }
    if (d.liveGen !== null && d.liveGen !== undefined) { lg += d.liveGen; ng++; }
  }
  return { livePre: np ? lp / np : null, liveGen: ng ? lg / ng : null };
}
function computeSettledRates() {
  const s = engineDeltas.slice(-10);
  let pT = 0, pS = 0, gT = 0, gS = 0;
  for (const d of s) { pT += d.preTok; pS += d.preSec; gT += d.genTok; gS += d.genSec; }
  return { preSettled: pS > 0 ? pT / pS : null, genSettled: gS > 0 ? gT / gS : null };
}

function ingestEngineLive(payload) {
  const m = payload.metrics;
  engineHasPromptFields = !!(payload.features && payload.features.hasPromptFields);
  const prev = engineSamples.length ? engineSamples[engineSamples.length - 1] : null;
  if (prev && prev.m && m && Number(m.n_decode_total) < Number(prev.m.n_decode_total)) {
    resetEngineSeries();
  }
  const now = Date.now();
  const dtPrev = engineSamples.length ? engineSamples[engineSamples.length - 1] : null;
  const dt = dtPrev ? (now - dtPrev.t) / 1000 : 0;
  const live = readSlots(payload.slots, dt);
  engineSamples.push({ t: now, m });
  if (engineSamples.length > ENGINE_MAXCOLS + 1) engineSamples.shift();
  if (dtPrev && dt > 0 && dtPrev.m && m) {
    engineDeltas.push({
      t: now, dt,
      preTok: Math.max(0, (m.prompt_tokens_total || 0) - (dtPrev.m.prompt_tokens_total || 0)),
      preSec: Math.max(0, (m.prompt_seconds_total || 0) - (dtPrev.m.prompt_seconds_total || 0)),
      genTok: Math.max(0, (m.tokens_predicted_total || 0) - (dtPrev.m.tokens_predicted_total || 0)),
      genSec: Math.max(0, (m.tokens_predicted_seconds_total || 0) - (dtPrev.m.tokens_predicted_seconds_total || 0)),
      decodes: Math.max(0, (m.n_decode_total || 0) - (dtPrev.m.n_decode_total || 0)),
      livePre: live ? live.preRate : null,
      liveGen: live ? live.genRate : null,
    });
    if (engineDeltas.length > ENGINE_MAXCOLS) engineDeltas.shift();
  }
  renderEngineLive(payload, live);
}

function renderEngineIdentity(payload) {
  const eng = payload.engine || {};
  const props = payload.props;
  let title, sub;
  if (props) {
    const model = String(props.model_path || '').split('/').pop() || 'unknown model';
    const bits = [model];
    if (props.build_info) bits.push(props.build_info);
    if (props.total_slots != null) bits.push(`${props.total_slots} slots`);
    title = bits.join(' · ');
    sub = [eng.llama_url, props.n_ctx ? `n_ctx ${fmtFull(props.n_ctx)}` : null,
      props.endpoint_metrics === false ? 'metrics disabled on this server' : null]
      .filter(Boolean).join(' · ');
  } else {
    title = eng.label || eng.id || 'Engine';
    sub = [eng.llama_url, payload.props_error ? `model info unavailable (${payload.props_error})` : null]
      .filter(Boolean).join(' · ');
  }
  $('engine-identity-title').textContent = title;
  $('engine-identity-sub').textContent = sub;
}

function renderEngineLive(payload, live) {
  renderEngineIdentity(payload);

  const m = payload.metrics || {};
  const { livePre, liveGen } = computeLiveRates();
  const { preSettled, genSettled } = computeSettledRates();
  const liveSource = liveGen !== null ? 'slots' : (engineDeltas.length ? 'decode' : 'none');

  const tiles = [];
  if (liveSource === 'slots' && livePre !== null) {
    tiles.push(tileEl('Prefill · now', valueWithUnit(livePre < 0.5 ? '0' : fmtNum(livePre, 0), 'tok/s'),
      `on completion ${preSettled != null ? fmtNum(preSettled, 0) + ' tok/s' : '—'}`));
  } else if (liveSource === 'slots') {
    tiles.push(tileEl('Prefill · now', valueWithUnit(preSettled == null ? '—' : fmtNum(preSettled, 0), 'tok/s'),
      "this build's /slots omits prompt counters — differenced from /metrics instead"));
  } else {
    tiles.push(tileEl('Prefill · now', valueWithUnit('—', 'tok/s'), 'no slot data'));
  }

  if (liveSource === 'slots') {
    tiles.push(tileEl('Generation · now', valueWithUnit(liveGen < 0.05 ? '0' : fmtNum(liveGen, 1), 'tok/s'),
      `on completion ${genSettled != null ? fmtNum(genSettled, 1) + ' tok/s' : '—'}`,
      liveGen >= 0.05 ? 'state-generating' : ''));
  } else if (liveSource === 'decode') {
    const r = engineDeltas.slice(-3);
    let dTot = 0, dWall = 0;
    for (const d of r) { dTot += d.decodes || 0; dWall += d.dt; }
    const decRate = dWall > 0 ? dTot / dWall : null;
    tiles.push(tileEl('Generation · now', valueWithUnit(decRate == null ? '—' : fmtNum(decRate, 1), 'dec/s'),
      'no slot data — llama_decode() calls per second instead'));
  } else {
    tiles.push(tileEl('Generation · now', valueWithUnit('—', 'tok/s'), '—'));
  }

  const cr = engineCacheReuse();
  tiles.push(tileEl('Prompt cache reuse', valueWithUnit(cr ? fmtNum(cr.pct, 1) : '—', '%'),
    cr
      ? `${fmtCompact(cr.cached)} reused of ${fmtCompact(cr.total)} prompt tokens across ${engineTaskOrder.length} requests`
      : (!engineHasPromptFields
          ? "Unavailable: this build's /slots does not report n_prompt_tokens_cache."
          : 'Share of prompt tokens served from cache instead of reprocessed.')));

  let stateTxt = 'idle', stateSub = 'No slot is processing.', stateClass = 'state-idle';
  if (live) {
    if (live.generating) {
      stateTxt = 'generating'; stateClass = 'state-generating';
      stateSub = `${live.generating} slot${live.generating === 1 ? '' : 's'} decoding`;
    } else if (live.prefilling) {
      stateTxt = 'prefilling'; stateClass = 'state-prefilling';
      stateSub = `${live.prefilling} slot${live.prefilling === 1 ? '' : 's'} processing prompt`;
    } else {
      stateSub = `${live.idle} slot${live.idle === 1 ? '' : 's'} idle`;
    }
  } else if (Number(m.requests_processing) > 0) {
    stateTxt = 'busy'; stateSub = 'slots endpoint unavailable — falling back to the gauge';
  }
  const deferred = Number(m.requests_deferred || 0);
  if (deferred > 0) { stateSub += ` · ${deferred} deferred`; stateClass = 'state-queued'; }
  tiles.push(tileEl('Server state', document.createTextNode(stateTxt), stateSub, stateClass));

  $('engine-tiles').replaceChildren(...tiles);
  renderEngineSlots(payload.slots, payload.slots_error);
  drawEngineStrip();

  $('engine-strip-legend').replaceChildren(
    el('span', { class: 'key' }, el('span', { class: 'swatch', style: 'background:var(--series-1)' }), el('span', { text: 'Prefill' })),
    el('span', { class: 'key' }, el('span', { class: 'swatch', style: 'background:var(--series-2)' }), el('span', { text: 'Generation' })));
  $('engine-strip-note').textContent = engineDeltas.length
    ? `${engineDeltas.length} interval${engineDeltas.length === 1 ? '' : 's'} · ${fmtNum(engineDeltas[engineDeltas.length - 1].dt, 1)}s per column`
    : 'waiting for a second reading — rates need two points';
}

function renderEngineSlots(slots, slotsError) {
  const holder = $('engine-slots');
  if (!Array.isArray(slots) || !slots.length) {
    holder.replaceChildren(el('div', { class: 'empty',
      text: 'No slot data' + (slotsError ? ` — ${slotsError}` : '') + '. Live token rates need this endpoint.' }));
    return;
  }
  const showPrompt = engineHasPromptFields;
  const head = el('tr', {},
    el('th', { text: 'Slot' }), el('th', { text: 'State' }), el('th', { class: 'num', text: 'Task' }),
    ...(showPrompt ? [el('th', { text: 'Prompt' }), el('th', { class: 'num', text: 'Cached' })] : []),
    el('th', { class: 'num', text: 'Decoded' }), el('th', { class: 'num', text: 'Context' }));
  const rows = slots.map((s) => {
    const busy = !!s.is_processing;
    const nt = s.next_token || {};
    const dec = nt.n_decoded || 0;
    const total = s.n_prompt_tokens || 0;
    const cache = s.n_prompt_tokens_cache || 0;
    const proc = s.n_prompt_tokens_processed || 0;
    const done = Math.min(total, cache + proc);
    const pct = total > 0 ? 100 * done / total : 0;
    const state = !busy ? 'idle' : (dec > 0 ? 'generating' : 'prefilling');
    const tagClass = !busy ? '' : (dec > 0 ? 'gen' : 'pre');
    const barColor = dec > 0 ? 'var(--series-2)' : 'var(--series-1)';
    return el('tr', { class: busy ? '' : 'slot-idle' },
      el('td', { text: String(s.id) }),
      el('td', {}, el('span', { class: 'slot-tag' + (tagClass ? ' ' + tagClass : ''), text: state })),
      el('td', { class: 'num', text: (s.id_task == null || s.id_task === -1) ? '—' : String(s.id_task) }),
      ...(showPrompt ? [
        el('td', {}, total > 0
          ? el('div', { class: 'slot-bar-track' },
              el('div', { class: 'slot-bar-rail' },
                el('div', { class: 'slot-bar-fill', style: `width:${pct.toFixed(1)}%;background:${barColor}` })),
              el('span', { class: 'slot-bar-label', text: `${fmtCompact(done)} / ${fmtCompact(total)}` }))
          : el('span', { class: 'cell-sub', text: '—' })),
        el('td', { class: 'num', text: total > 0 ? `${fmtNum(100 * cache / total, 0)}%` : '—' }),
      ] : []),
      el('td', { class: 'num', text: (busy || dec) ? fmtFull(dec) : '—' }),
      el('td', { class: 'num cell-sub', text: fmtCompact(s.n_ctx) }));
  });
  holder.replaceChildren(el('table', {}, el('thead', {}, head), el('tbody', {}, ...rows)));
}

// ── Engine live strip (canvas — 400+ columns, SVG would be too heavy) ──
function cssVar(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function sizeEngineCanvas(c, ctx) {
  const dpr = window.devicePixelRatio || 1;
  const r = c.getBoundingClientRect();
  c.width = Math.max(1, Math.round(r.width * dpr));
  c.height = Math.max(1, Math.round(r.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w: r.width, h: r.height };
}
function drawEngineStrip() {
  const c = $('engine-strip');
  if (!c.isConnected || c.clientWidth === 0) return;
  const ctx = c.getContext('2d');
  const pre = [], gen = [];
  for (const d of engineDeltas) {
    pre.push(d.livePre !== null && d.livePre !== undefined ? d.livePre : (d.preSec > 0 ? d.preTok / d.preSec : 0));
    gen.push(d.liveGen !== null && d.liveGen !== undefined ? d.liveGen : (d.genSec > 0 ? d.genTok / d.genSec : 0));
  }
  const { w: W, h: H } = sizeEngineCanvas(c, ctx);
  ctx.clearRect(0, 0, W, H);
  const padL = 46, padR = 12, padT = 14, padB = 14;
  const plotW = W - padL - padR, mid = padT + (H - padT - padB) / 2, half = (H - padT - padB) / 2 - 6;
  const rule = cssVar('--gridline'), faint = cssVar('--text-muted');

  ctx.strokeStyle = rule; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, Math.round(mid) + 0.5); ctx.lineTo(W - padR, Math.round(mid) + 0.5); ctx.stroke();

  if (!pre.length) {
    ctx.fillStyle = faint; ctx.font = '12px system-ui, -apple-system, "Segoe UI", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('waiting for a second reading — rates need two points', W / 2, mid - 12);
    return;
  }

  const maxPre = Math.max(1, ...pre), maxGen = Math.max(1, ...gen);
  const n = pre.length, slot = plotW / Math.max(n, 24), bw = Math.max(1.5, slot - 1.6);

  ctx.setLineDash([2, 4]); ctx.strokeStyle = rule; ctx.beginPath();
  ctx.moveTo(padL, Math.round(mid - half) + 0.5); ctx.lineTo(W - padR, Math.round(mid - half) + 0.5);
  ctx.moveTo(padL, Math.round(mid + half) + 0.5); ctx.lineTo(W - padR, Math.round(mid + half) + 0.5);
  ctx.stroke(); ctx.setLineDash([]);

  ctx.fillStyle = faint; ctx.font = '10px system-ui, -apple-system, "Segoe UI", sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(fmtCompact(maxPre), padL - 8, mid - half + 4);
  ctx.fillText(fmtCompact(maxGen), padL - 8, mid + half + 4);
  ctx.fillText('0', padL - 8, mid + 3.5);

  const cPre = cssVar('--series-1'), cGen = cssVar('--series-2');
  for (let j = 0; j < n; j++) {
    const x = padL + plotW - (n - j) * slot + (slot - bw) / 2;
    const hp = (pre[j] / maxPre) * half;
    if (hp > 0.4) { ctx.fillStyle = cPre; ctx.fillRect(x, mid - hp, bw, hp); }
    const hg = (gen[j] / maxGen) * half;
    if (hg > 0.4) { ctx.fillStyle = cGen; ctx.fillRect(x, mid + 1, bw, hg); }
  }
}
window.addEventListener('resize', () => {
  if (activeTab === 'engine' && !$('engine-content').hidden) drawEngineStrip();
});

// ── Engine tab: fetch orchestration, picker, empty states ──────────
function showEngineEmpty(content) {
  $('engine-content').hidden = true;
  $('engine-empty').hidden = false;
  const holder = $('engine-empty-text');
  if (typeof content === 'string') holder.textContent = content;
  else holder.replaceChildren(...(Array.isArray(content) ? content : [content]));
}

function renderEnginePicker() {
  const row = $('engine-picker-row');
  if (engineList.length < 2) { row.hidden = true; $('engine-picker').replaceChildren(); return; }
  row.hidden = false;
  $('engine-picker').replaceChildren(...engineList.map((e) =>
    el('button', { class: 'seg-btn', type: 'button', 'data-id': e.id,
      'aria-pressed': String(e.id === currentEngineId), text: e.label || e.id })));
}
$('engine-picker').addEventListener('click', (ev) => {
  const btn = ev.target.closest('.seg-btn');
  if (!btn || btn.dataset.id === currentEngineId) return;
  selectEngine(btn.dataset.id);
});
function selectEngine(id) {
  currentEngineId = id;
  resetEngineSeries();
  renderEnginePicker();
  if (activeTab === 'engine') pollEngineLive();
}

async function loadEngineList() {
  try {
    const res = await fetch('/api/engines');
    const j = await res.json();
    engineList = Array.isArray(j.engines) ? j.engines : [];
  } catch {
    engineList = [];
  }
  if (!currentEngineId && engineList.length) currentEngineId = engineList[0].id;
  renderEnginePicker();
  if (!engineList.length) {
    showEngineEmpty([
      el('span', { text: 'No llama.cpp engine configured. Add one in ' }),
      el('a', { href: '/setup.html', text: 'Setup' }),
      el('span', { text: '.' }),
    ]);
  }
  if (activeTab === 'engine' && !enginePollTimer && engineList.length) startEnginePoll();
}

function engineAllFailed(payload) {
  return !payload.metrics && !payload.slots && !payload.props;
}

async function pollEngineLive() {
  if (!currentEngineId) return;
  try {
    const res = await fetch(`/api/engine/live?engine=${encodeURIComponent(currentEngineId)}`);
    const payload = await res.json();
    if (payload.error) { showEngineEmpty(payload.error); return; }
    if (engineAllFailed(payload)) {
      resetEngineSeries();
      showEngineEmpty(`Cannot reach ${payload.engine?.label || currentEngineId} — ` +
        `${payload.metrics_error || payload.slots_error || payload.props_error || 'unreachable'}.`);
      return;
    }
    $('engine-empty').hidden = true;
    $('engine-content').hidden = false;
    ingestEngineLive(payload);
  } catch {
    showEngineEmpty('Stats server unreachable.');
  }
}

function startEnginePoll() {
  stopEnginePoll();
  if (!engineList.length) { loadEngineList(); return; }
  pollEngineLive();
  enginePollTimer = setInterval(pollEngineLive, ENGINE_POLL_MS);
}
function stopEnginePoll() {
  if (enginePollTimer) { clearInterval(enginePollTimer); enginePollTimer = null; }
}

loadEngineList();
setActiveTab(location.hash.replace('#', '') || 'usage', { skipHash: true });
</script>
</body>
